<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Author Outreach — Prospect Intelligence</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --faint:#6e7681;
    --accent:#d29922; --green:#3fb950; --red:#f85149; --blue:#58a6ff;
    --purple:#bc8cff; --amber:#e3b341;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:18px;padding:12px 22px;
    border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:50}
  header .brand{font-weight:700;font-size:15px;letter-spacing:.2px}
  header .brand span{color:var(--accent)}
  nav{display:flex;gap:4px}
  nav a{color:var(--dim);padding:6px 12px;border-radius:6px;font-weight:500}
  nav a:hover{color:var(--text);text-decoration:none;background:var(--panel2)}
  nav a.active{color:var(--text);background:var(--panel2)}
  nav a .pill{background:var(--accent);color:#0d1117;border-radius:99px;
    font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
  .spacer{flex:1}
  main{max-width:1180px;margin:0 auto;padding:26px 22px 80px}
  h1{font-size:21px;margin-bottom:4px}
  h2{font-size:16px;margin:0 0 12px}
  .sub{color:var(--dim);margin-bottom:22px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:18px;margin-bottom:16px}
  .grid{display:grid;gap:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  label{font-size:12px;color:var(--dim);font-weight:600;display:block;margin-bottom:4px}
  select,input[type=text],input[type=number],textarea{
    background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--blue)}
  textarea{width:100%;min-height:110px;resize:vertical;font-family:inherit}
  button{background:var(--accent);color:#0d1117;border:none;border-radius:6px;
    padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
  button.small{padding:5px 10px;font-size:12px}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:9px 10px;border-bottom:1px solid #21262d;font-size:13px;vertical-align:top}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
  .badge{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
  .b-hot{background:#3d1d1d;color:#ff7b72;border:1px solid #6e2e2e}
  .b-warm{background:#3a2f14;color:var(--amber);border:1px solid #6e5310}
  .b-cool{background:#1b2430;color:#7d8b9a;border:1px solid #2d3a47}
  .b-platform{background:var(--panel2);color:var(--dim);border:1px solid var(--border);
    margin-right:4px;font-weight:600}
  .b-status-new{background:var(--panel2);color:var(--dim)}
  .b-status-reviewing{background:#12233a;color:var(--blue)}
  .b-status-messaged{background:#3a2f14;color:var(--amber)}
  .b-status-replied{background:#2a1f3d;color:var(--purple)}
  .b-status-won{background:#12331c;color:var(--green)}
  .b-status-lost{background:#3d1d1d;color:var(--red)}
  .b-status-skip{background:var(--panel2);color:var(--faint)}
  .flag{font-weight:800;font-size:13px}
  .f-yes{color:var(--green)} .f-no{color:var(--red)} .f-unk{color:var(--faint)}
  .logbox{background:#0a0d12;border:1px solid var(--border);border-radius:8px;
    padding:14px;font-family:var(--mono);font-size:12px;color:#9fb0c0;
    max-height:340px;overflow-y:auto;white-space:pre-wrap}
  .stats{display:flex;gap:10px;margin:12px 0}
  .stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:10px 16px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:13px}
  .kv dt{color:var(--dim)} .kv dd{color:var(--text)}
  .book{background:var(--panel2);border:1px solid var(--border);border-radius:8px;
    padding:14px;margin-bottom:10px}
  .book .title{font-weight:700;font-size:14px}
  .book .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .book-source{display:inline-block;margin-top:8px;font-size:12px;font-weight:700}
  .contact-list{display:grid;gap:8px}
  .contact-item{padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px}
  .contact-item .muted{display:block;margin-top:3px}
  .manual{display:flex;gap:8px;align-items:end;margin-top:10px;flex-wrap:wrap}
  .manual input{width:90px}
  .gap-item{padding:6px 0 6px 26px;position:relative}
  .gap-item:before{content:"✗";position:absolute;left:6px;color:var(--red);font-weight:800}
  .angle{background:#2a230f;border:1px solid #6e5310;border-radius:8px;padding:12px 14px;
    color:var(--amber);font-size:13px;margin-top:10px}
  .evidence{border-left:3px solid var(--border);padding:8px 12px;margin-bottom:8px;
    font-size:13px;color:#b6c2cf}
  .evidence .src{color:var(--faint);font-size:11px;font-family:var(--mono)}
  .match-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .match-names{font-weight:700}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--panel2);
    border:1px solid var(--border);border-left:3px solid var(--green);
    border-radius:8px;padding:12px 18px;font-size:13px;z-index:100;
    box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;max-width:420px}
  .pagen{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
  .muted{color:var(--dim);font-size:12px}
  .backlink{margin-bottom:14px;display:inline-block}
  @media(max-width:820px){ .kv{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="brand">📚 Author<span>Outreach</span></div>
  <nav>
    <a href="#/crawl" id="nav-crawl">Crawl</a>
    <a href="#/leads" id="nav-leads">Leads</a>
    <a href="#/matches" id="nav-matches">Matches <span class="pill" id="match-pill">0</span></a>
  </nav>
  <div class="spacer"></div>
  <span class="muted" id="author-count"></span>
  <button class="secondary small" onclick="doExport()">⬇ Export CSV</button>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const main = $("#main");
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(path, method="GET", body=null){
  const r = await fetch(path, {
    method,
    headers: body ? {"Content-Type":"application/json"} : {},
    body: body ? JSON.stringify(body) : null
  });
  return r.json();
}
function toast(msg, ok=true){
  const t = $("#toast");
  t.style.borderLeftColor = ok ? "var(--green)" : "var(--red)";
  t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(()=> t.style.display="none", 3800);
}
const CRITERIA_LABELS = {
  reviews_0_50:"Book has 0–50 reviews", just_launched:"Just launched / debut",
  low_popularity:"Not yet popular", weak_ad_content:"Weak advertising content"
};
const CRITERIA_KEYS = Object.keys(CRITERIA_LABELS);
const STATUSES = ["new","reviewing","messaged","replied","won","lost","skip"];
const PLATFORM_LABELS = {};   // filled from /api/platforms

function flag(v){ return v===true ? '<span class="flag f-yes">✓</span>'
                        : v===false ? '<span class="flag f-no">✗</span>'
                        : '<span class="flag f-unk">?</span>'; }
function criteriaChips(c){
  return CRITERIA_KEYS.map(k =>
    `<span title="${esc(CRITERIA_LABELS[k])}">${flag(c[k])}</span>`).join(" ");
}
function tierBadge(score){
  const t = score>=60 ? "hot" : score>=40 ? "warm" : "cool";
  return `<span class="badge b-${t}">${t.toUpperCase()} ${score}</span>`;
}
const statusBadge = s => `<span class="badge b-status-${esc(s)}">${esc(s)}</span>`;

// ---------------------------------------------------------------- router
window.addEventListener("hashchange", route);
async function route(){
  const h = location.hash || "#/crawl";
  const [_, view, arg] = h.split("/");
  document.querySelectorAll("nav a").forEach(a=>a.classList.remove("active"));
  $(`#nav-${view}`) && $(`#nav-${view}`).classList.add("active");
  if(view==="crawl") renderCrawl();
  else if(view==="leads") renderLeads();
  else if(view==="author") renderAuthor(arg);
  else if(view==="matches") renderMatches();
  else renderCrawl();
  refreshCounts();
}
async function refreshCounts(){
  try{
    const d = await api("/api/platforms");
    $("#author-count").textContent = d.total_authors + " authors";
    $("#match-pill").textContent = d.pending_matches;
    d.platforms.forEach(p => PLATFORM_LABELS[p.key]=p.label);
  }catch(e){}
}

// ---------------------------------------------------------------- CRAWL
let pollTimer = null;
async function renderCrawl(){
  main.innerHTML = `
    <h1>Crawl a platform</h1>
    <p class="sub">Pick a platform from the dropdown, start the crawl, and watch profiles
       land in your database. Everything is source-tagged and cross-referenced afterwards.</p>
    <div class="card">
      <div class="row" style="align-items:flex-end">
        <div style="min-width:280px">
          <label>Platform to crawl</label>
          <select id="platform-select" style="width:100%"></select>
        </div>
        <button id="crawl-btn" onclick="startCrawl()">▶ Start crawl</button>
        <span class="muted" id="crawl-state"></span>
      </div>
    </div>
    <div class="card">
      <h2>Live log</h2>
      <div class="stats" id="crawl-stats" style="display:none">
        <div class="stat"><b id="st-new">0</b><span>new authors</span></div>
        <div class="stat"><b id="st-upd">0</b><span>re-spotted</span></div>
        <div class="stat"><b id="st-tot">0</b><span>total touched</span></div>
      </div>
      <div class="logbox" id="crawl-log">idle — select a platform above and press Start.</div>
    </div>`;
  const d = await api("/api/platforms");
  const sel = $("#platform-select");
  const groups = {};
  d.platforms.forEach(p => {
    const g = p.built ? "✅ Available now"
            : p.status==="blocked" ? "⛔ Blocked (bot-protected)" : "⏸ Deferred (JS-rendered)";
    groups[g] = groups[g] || [];
    groups[g].push(p);
  });
  Object.entries(groups).forEach(([g, ps])=>{
    const og = document.createElement("optgroup"); og.label = g;
    ps.forEach(p=>{
      const o = document.createElement("option");
      o.value = p.key;
      const count = d.identity_counts[p.key] || 0;
      o.textContent = `${p.label} — ${p.note}` + (count ? `  (${count} in DB)` : "");
      if(!p.built) o.disabled = true;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value = "bluesky";
  pollStatus();
}
async function startCrawl(){
  const platform = $("#platform-select").value;
  const btn = $("#crawl-btn");
  btn.disabled = true; btn.textContent = "… starting";
  const r = await api("/api/crawl","POST",{platform});
  btn.disabled = false; btn.textContent = "▶ Start crawl";
  if(!r.ok){ toast(r.message, false); return; }
  toast("Crawl started for " + platform);
  clearInterval(pollTimer); pollTimer = setInterval(pollStatus, 1200);
  pollStatus();
}
async function pollStatus(){
  const s = await api("/api/crawl/status");
  const box = $("#crawl-log"); if(!box) { clearInterval(pollTimer); return; }
  if(s.log && s.log.length){
    box.textContent = s.log.join("\n");
    box.scrollTop = box.scrollHeight;
  }
  const st = $("#crawl-state");
  if(s.running){
    st && (st.textContent = "running: " + s.platform + "…");
    $("#crawl-stats").style.display = "flex";
    $("#st-new").textContent = (s.stats.new||0);
    $("#st-upd").textContent = (s.stats.updated||0);
    $("#st-tot").textContent = (s.stats.touched||0);
    if(!pollTimer) pollTimer = setInterval(pollStatus, 1200);
  } else {
    st && (st.textContent = "idle");
    clearInterval(pollTimer); pollTimer = null;
  }
}

// ---------------------------------------------------------------- LEADS
let leadsFilters = {q:"",platform:"",tier:"",criterion:"",status:"",contact:"",page:1};
async function renderLeads(){
  main.innerHTML = `
    <h1>Leads</h1>
    <p class="sub">Every author the system has found, ranked by heat score.
       ✓ / ✗ / ? = your qualification criteria (0–50 reviews · just launched · not yet popular · weak ads).</p>
    <div class="card">
      <div class="row">
        <div><label>Search</label>
          <input type="text" id="f-q" placeholder="name or handle…" value="${esc(leadsFilters.q)}"></div>
        <div><label>Platform</label><select id="f-platform"></select></div>
        <div><label>Tier</label>
          <select id="f-tier">
            <option value="">All tiers</option>
            <option value="hot">🔥 Hot (60+)</option>
            <option value="warm">🟡 Warm (40–59)</option>
            <option value="cool">Cool (&lt;40)</option>
          </select></div>
        <div><label>Criterion</label>
          <select id="f-criterion">
            <option value="">Any</option>
            ${CRITERIA_KEYS.map(k=>`<option value="${k}">${esc(CRITERIA_LABELS[k])}</option>`).join("")}
          </select></div>
        <div><label>Contact details</label>
          <select id="f-contact">
            <option value="">Any</option>
            <option value="email">Has public email</option>
            <option value="website">Has website/contact page</option>
          </select></div>
        <div><label>Status</label>
          <select id="f-status">
            <option value="">Any</option>
            ${STATUSES.map(s=>`<option value="${s}">${s}</option>`).join("")}
          </select></div>
        <div style="flex:1"></div>
        <div><label>&nbsp;</label><button class="secondary" onclick="applyFilters()">Apply</button></div>
      </div>
    </div>
    <div class="card" id="leads-table">Loading…</div>`;
  const d = await api("/api/platforms");
  const sel = $("#f-platform");
  sel.innerHTML = `<option value="">All platforms</option>` +
    d.platforms.filter(p=>p.built).map(p=>
      `<option value="${p.key}">${esc(p.label)} (${d.identity_counts[p.key]||0})</option>`).join("");
  $("#f-tier").value = leadsFilters.tier;
  $("#f-criterion").value = leadsFilters.criterion;
  $("#f-status").value = leadsFilters.status;
  $("#f-contact").value = leadsFilters.contact;
  $("#f-q").addEventListener("keydown", e=>{ if(e.key==="Enter") applyFilters(); });
  loadLeads();
}
function applyFilters(){
  leadsFilters = {q:$("#f-q").value.trim(), platform:$("#f-platform").value,
    tier:$("#f-tier").value, criterion:$("#f-criterion").value,
    status:$("#f-status").value, contact:$("#f-contact").value, page:1};
  loadLeads();
}
async function loadLeads(){
  const f = leadsFilters;
  const qs = new URLSearchParams({q:f.q, platform:f.platform, tier:f.tier,
    criterion:f.criterion, status:f.status, contact:f.contact||"", page:f.page}).toString();
  const d = await api("/api/leads?"+qs);
  const el = $("#leads-table");
  if(!d.rows || !d.rows.length){
    el.innerHTML = `<div class="empty">No leads match. Crawl more platforms or relax the filters.</div>`;
    return;
  }
  el.innerHTML = `
    <table>
      <tr><th>Score</th><th>Author</th><th>Platforms</th><th>Books</th><th>Contact</th>
          <th title="${esc(CRITERIA_KEYS.map(k=>CRITERIA_LABELS[k]).join(' · '))}">Criteria</th>
          <th>Status</th><th>Last seen</th></tr>
      ${d.rows.map(r=>`
        <tr class="click" onclick="location.hash='#/author/${r.id}'">
          <td>${tierBadge(r.heat_score)}</td>
          <td><b>${esc(r.display_name||"(unnamed)")}</b></td>
          <td>${r.platforms.map(p=>`<span class="badge b-platform">${esc(PLATFORM_LABELS[p]||p)}</span>`).join("")}</td>
          <td>${r.books||"—"}</td>
          <td>${r.has_email?'<span class="badge b-status-won">Email</span> ':''}${r.has_website?'<span class="badge b-status-reviewing">Site</span>':''}${!r.has_email&&!r.has_website?'—':''}</td>
          <td>${criteriaChips(r.criteria)}</td>
          <td>${statusBadge(r.status)}</td>
          <td class="muted">${esc((r.last_seen||"").slice(0,10))}</td>
        </tr>`).join("")}
    </table>
    <div class="pagen">
      <button class="secondary small" ${d.page<=1?"disabled":""}
        onclick="leadsFilters.page--;loadLeads()">← Prev</button>
      <span class="muted">page ${d.page} / ${d.pages} · ${d.total} leads</span>
      <button class="secondary small" ${d.page>=d.pages?"disabled":""}
        onclick="leadsFilters.page++;loadLeads()">Next →</button>
    </div>`;
}

// ---------------------------------------------------------------- AUTHOR
async function renderAuthor(id){
  main.innerHTML = `<div class="empty">Loading profile…</div>`;
  const a = await api("/api/author/"+id);
  if(a.error){ main.innerHTML = `<div class="empty">Author not found.</div>`; return; }
  const act = [];
  if(a.last_post_days!=null) act.push(`last posted ${a.last_post_days} days ago`);
  if(a.posts_per_month!=null) act.push(`~${a.posts_per_month} posts/month`);
  act.push(`${a.identities.length} platform${a.identities.length>1?"s":""}`);

  main.innerHTML = `
    <a class="backlink" href="#/leads">← Back to leads</a>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div>
          <h1>${esc(a.display_name||"(unnamed)")}</h1>
          <div class="row" style="margin-top:6px">
            ${tierBadge(a.heat_score)}
            <span class="muted">first seen ${esc((a.first_seen||"").slice(0,10))} ·
              last seen ${esc((a.last_seen||"").slice(0,10))}</span>
          </div>
        </div>
        <div>
          <label>Status</label>
          <select id="a-status" onchange="saveAuthor(${a.id},null)">
            ${STATUSES.map(s=>`<option value="${s}" ${s===a.status?"selected":""}>${s}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="angle">💡 <b>Suggested angle:</b> ${esc(a.suggested_angle||"—")}</div>
    </div>

    <div class="card">
      <h2>Identities (cross-referenced)</h2>
      <table>
        <tr><th>Platform</th><th>Handle</th><th>Spotted</th><th>Last seen</th><th>Profile</th></tr>
        ${a.identities.map(i=>`
          <tr>
            <td><span class="badge b-platform">${esc(PLATFORM_LABELS[i.platform]||i.platform)}</span></td>
            <td><code>${esc(i.handle)}</code></td>
            <td>${i.spotted_count}×</td>
            <td class="muted">${esc((i.last_seen||"").slice(0,10))}</td>
            <td><a href="${esc(i.platform_url)}" target="_blank" rel="noopener">open ↗</a></td>
          </tr>`).join("")}
      </table>
    </div>

    <div class="card">
      <h2>Public contact details</h2>
      <div class="row" style="margin-bottom:10px">
        <button class="secondary small" onclick="enrichContacts(${a.id}, this)">↻ Check public contacts</button>
        <span class="muted">Checks listed profile links and a few pages on author websites.</span>
      </div>
      ${a.contacts.length ? `<div class="contact-list">${a.contacts.map(c=>`
        <div class="contact-item">
          <b>${esc(c.kind.replaceAll("_", " "))}:</b>
          ${c.kind==="email" ? `<a href="mailto:${esc(c.value)}">${esc(c.value)}</a>` :
            `<a href="${esc(c.value)}" target="_blank" rel="noopener">${esc(c.value)} ↗</a>`}
          ${c.source_url?`<span class="muted">Found on <a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.source_platform||"public page")} ↗</a></span>`:""}
        </div>`).join("")}</div>` : `<div class="empty">No public email or author website found yet.</div>`}
      <p class="muted" style="margin-top:10px">Only publicly listed contact details are collected. Verify the source and honor opt-outs before contacting.</p>
    </div>

    <div class="card">
      <h2>Books</h2>
      ${a.books.length ? a.books.map(b=>`
        <div class="book">
          <div class="title">📘 ${esc(b.title)}</div>
          ${b.book_url?`<a class="book-source" href="${esc(b.book_url)}" target="_blank" rel="noopener">Open book listing ↗</a>`:`<div class="muted" style="margin-top:8px">No direct book listing URL was captured for this source.</div>`}
          <div class="meta">
            found on <b>${esc(PLATFORM_LABELS[b.platform]||b.platform)}</b>
            ${b.genre?` · genre: ${esc(b.genre)}`:""}
            ${b.price?` · ${esc(b.price)}`:""}
            ${b.popularity?` · ${esc(b.popularity)}`:""}
            ${b.ratings_count!=null?` · <b>${b.ratings_count} ratings</b> (platform)`:""}
          </div>
          <div class="manual">
            <div><label>Amazon reviews</label>
              <input type="number" min="0" id="amz-${b.id}" value="${b.amazon_reviews??""}" placeholder="?"></div>
            <div><label>Goodreads ratings</label>
              <input type="number" min="0" id="gr-${b.id}" value="${b.goodreads_ratings??""}" placeholder="?"></div>
            <button class="small" onclick="saveBook(${b.id})">Save</button>
            <a class="small" style="align-self:center" href="${esc(b.check.amazon)}" target="_blank" rel="noopener">check Amazon ↗</a>
            <a class="small" style="align-self:center" href="${esc(b.check.goodreads)}" target="_blank" rel="noopener">check Goodreads ↗</a>
          </div>
        </div>`).join("") : `<div class="empty">No books detected yet — check the author's profiles via the links above.</div>`}
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <h2>Qualification criteria</h2>
        <table>
          ${CRITERIA_KEYS.map(k=>`
            <tr><td>${esc(CRITERIA_LABELS[k])}</td><td style="text-align:right">${flag(a.criteria[k])}</td></tr>`).join("")}
        </table>
        <p class="muted" style="margin-top:8px">? = not enough data yet (open the check links under Books and type the numbers in — the flags update instantly).</p>
        <h2 style="margin-top:20px">Activity &amp; reach</h2>
        <p>${esc(act.join(" · "))}</p>
      </div>
      <div class="card">
        <h2>Detected marketing gaps</h2>
        ${a.gaps.length ? a.gaps.map(g=>`<div class="gap-item">${esc(g)}</div>`).join("")
          : `<div class="empty">No gaps detected from public signals.</div>`}
      </div>
    </div>

    <div class="card">
      <h2>Evidence (source-tagged)</h2>
      ${a.posts.length ? a.posts.slice(0,12).map(p=>`
        <div class="evidence">
          <div class="src">${esc(p.platform)} · ${esc((p.posted_at||"").slice(0,10))} ·
            <a href="${esc(p.post_url)}" target="_blank" rel="noopener">source ↗</a></div>
          ${esc((p.text||"").slice(0,240))}
        </div>`).join("") : `<div class="empty">No posts captured for this author.</div>`}
    </div>

    <div class="card">
      <h2>Your notes / draft message</h2>
      <p class="muted" style="margin-bottom:8px">Private to you — the system never sends anything.
         Use the gaps and evidence above to personalize.</p>
      <textarea id="a-notes" placeholder="Draft your outreach message here…">${esc(a.notes)}</textarea>
      <div class="row" style="margin-top:10px">
        <button onclick="saveAuthor(${a.id},true)">Save notes</button>
        <span class="muted">saves automatically confirm below</span>
      </div>
    </div>`;
}
async function saveAuthor(id, fromNotes){
  const status = $("#a-status") ? $("#a-status").value : undefined;
  const notes = $("#a-notes") ? $("#a-notes").value : undefined;
  const body = {};
  if(status!==undefined) body.status = status;
  if(notes!==undefined) body.notes = notes;
  const r = await api("/api/author/"+id, "PATCH", body);
  r.ok ? toast(fromNotes ? "Notes saved" : "Status updated") : toast("Save failed", false);
  if(!fromNotes) refreshCounts();
}
async function saveBook(bookId){
  const amz = $("#amz-"+bookId), gr = $("#gr-"+bookId);
  const body = {book:{id:bookId,
    amazon_reviews: amz.value==="" ? null : parseInt(amz.value),
    goodreads_ratings: gr.value==="" ? null : parseInt(gr.value)}};
  const r = await api("/api/author/"+currentAuthorId(), "PATCH", body);
  r.ok ? toast("Review counts saved — criteria flags updated") : toast("Save failed", false);
  if(r.ok) renderAuthor(currentAuthorId());
}
async function enrichContacts(authorId, button){
  button.disabled = true; button.textContent = "Checking…";
  try{
    const r = await api(`/api/author/${authorId}/enrich`, "POST", {});
    if(!r.ok) throw new Error(r.error||"Contact check failed");
    toast(`Contact check complete · ${r.added} new detail(s) · ${r.total} total`);
    renderAuthor(authorId);
  }catch(e){ toast(e.message||"Contact check failed", false); }
  finally{ button.disabled = false; button.textContent = "↻ Check public contacts"; }
}
function currentAuthorId(){ return location.hash.split("/")[2]; }

// ---------------------------------------------------------------- MATCHES
async function renderMatches(){
  main.innerHTML = `
    <h1>Cross-platform matches</h1>
    <p class="sub">When the same pen name shows up on two platforms, the system suggests a merge.
       <b>You</b> decide — confirming combines both profiles into one author dossier.</p>
    <div class="card">
      <div class="row">
        <button class="secondary" onclick="scanMatches()">🔍 Scan for new matches</button>
        <span class="muted" id="scan-note"></span>
      </div>
    </div>
    <div id="match-list">Loading…</div>`;
  loadMatches();
}
async function scanMatches(){
  const r = await api("/api/matches/scan","POST",{});
  $("#scan-note").textContent = r.added ? `${r.added} new suggestion(s) found` : "no new suggestions";
  loadMatches(); refreshCounts();
}
async function loadMatches(){
  const d = await api("/api/matches");
  const el = $("#match-list");
  if(!d.matches.length){
    el.innerHTML = `<div class="card"><div class="empty">No pending matches.
      Run crawls on multiple platforms, then press “Scan for new matches”.</div></div>`;
    return;
  }
  el.innerHTML = d.matches.map(m=>`
    <div class="card match-card">
      <div>
        <div class="match-names">
          <a href="#/author/${m.author_a}">${esc(m.name_a||("#"+m.author_a))}</a>
          <span style="color:var(--accent)"> ⟷ </span>
          <a href="#/author/${m.author_b}">${esc(m.name_b||("#"+m.author_b))}</a>
        </div>
        <div class="muted">${esc(m.reason)}</div>
      </div>
      <div class="row">
        <button class="small" onclick="resolveMatch(${m.id},'confirm')">✔ Confirm merge</button>
        <button class="danger small" onclick="resolveMatch(${m.id},'reject')">✗ Not the same</button>
      </div>
    </div>`).join("");
}
async function resolveMatch(id, action){
  const r = await api(`/api/matches/${id}/${action}`,"POST",{});
  r.ok ? toast(action==="confirm" ? "Profiles merged" : "Suggestion rejected")
       : toast("Failed", false);
  loadMatches(); refreshCounts();
}

// ---------------------------------------------------------------- EXPORT
async function doExport(){
  const r = await api("/api/export","POST",{});
  r.ok!==undefined && !r.error ? toast("Exported: " + r.csv.split("/").slice(-2).join("/") + " and the briefing")
                               : toast("Export failed", false);
}
route();
</script>
